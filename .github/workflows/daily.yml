# 每天早上自動執行 main.py（多倫多時間）
#
# GitHub 的排程常常延遲好幾個小時（實測延遲 3–7 小時），
# 所以不再要求「剛好 8 點」才跑——舊版因為這個條件，每天都被跳過。
# 現在只排一個時間 UTC 11:00（夏令 7 點／冬令 6 點），GitHub 什麼時候真的開始跑都照跑。
# 每次讀最近 2 天的信，就算延遲或某天沒跑也不會漏信；
# Google Sheet 用網址去重、已分析過的職缺不會重複花錢，所以重疊讀信沒關係。

name: Daily job search

on:
  # 2026 年 11 月起暫停每日排程。要恢復的話，取消下面兩行的註解，並設定好 GitHub Secrets。
  # schedule:
  #   - cron: "0 11 * * *"
  workflow_dispatch: # 允許在 GitHub 網頁上手動按按鈕執行（測試用）
    inputs:
      days_back:
        description: "讀最近幾天的信"
        default: "2"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 萬一卡住，30 分鐘後強制停止

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run job search
        env:
          # 這些值存在 GitHub Secrets 裡，不會出現在程式碼或執行紀錄中
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '2' }}
        run: python main.py "$DAYS_BACK"
